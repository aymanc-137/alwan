<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Zig-Zag Shape with Stroke</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0; /* Light grey for contrast */
        }

        .shape-container {
            width: 100%;
            max-width: 800px; /* Adjust as needed */
            aspect-ratio: 2000 / 800; /* Original aspect ratio (wide) */
            
            background-color: #FCFFEC; /* The light yellow color (top part) */
            position: relative;
            overflow: hidden;

            /* Define half the stroke width as a CSS variable */
            --stroke-half-width: 1px; /* Total stroke will be 2px */
            /* For a thicker stroke, you could use e.g., --stroke-half-width: 2px; for a 4px stroke */

            /* Y-positions for the centerline of the horizontal zig-zag */
            --y-peak: 45%;    /* "Peaks" of the bottom (teal) shape point upwards */
            --y-valley: 55%;  /* "Valleys" of the bottom (teal) shape indent downwards */
        }

        .shape-container::before,
        .shape-container::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* ::before creates the black stroke */
        .shape-container::before {
            background-color: black; /* Stroke color */
            /*
                The clip-path for the horizontal stroke.
                It defines a polygon that is the zig-zag band.
                X-coordinates define horizontal progression (0%, 12.5%, ..., 100%).
                Y-coordinates define vertical position using --y-peak and --y-valley.
            */
            clip-path: polygon(
                /* Top edge of the stroke (upper boundary of the zig-zag band) */
                0%     calc(var(--y-peak) - var(--stroke-half-width)),  /* P1_top */
                12.5%  calc(var(--y-valley) - var(--stroke-half-width)),  /* V1_top */
                25%    calc(var(--y-peak) - var(--stroke-half-width)),  /* P2_top */
                37.5%  calc(var(--y-valley) - var(--stroke-half-width)),  /* V2_top */
                50%    calc(var(--y-peak) - var(--stroke-half-width)),  /* P3_top */
                62.5%  calc(var(--y-valley) - var(--stroke-half-width)),  /* V3_top */
                75%    calc(var(--y-peak) - var(--stroke-half-width)),  /* P4_top */
                87.5%  calc(var(--y-valley) - var(--stroke-half-width)),  /* V4_top */
                100%   calc(var(--y-peak) - var(--stroke-half-width)),  /* P5_top */
                
                /* Bottom edge of the stroke (traced in reverse X order to close the polygon) */
                100%   calc(var(--y-peak) + var(--stroke-half-width)),  /* P5_bottom */
                87.5%  calc(var(--y-valley) + var(--stroke-half-width)),  /* V4_bottom */
                75%    calc(var(--y-peak) + var(--stroke-half-width)),  /* P4_bottom */
                62.5%  calc(var(--y-valley) + var(--stroke-half-width)),  /* V3_bottom */
                50%    calc(var(--y-peak) + var(--stroke-half-width)),  /* P3_bottom */
                37.5%  calc(var(--y-valley) + var(--stroke-half-width)),  /* V2_bottom */
                25%    calc(var(--y-peak) + var(--stroke-half-width)),  /* P2_bottom */
                12.5%  calc(var(--y-valley) + var(--stroke-half-width)),  /* V1_bottom */
                0%     calc(var(--y-peak) + var(--stroke-half-width))   /* P1_bottom */
            );
            /* z-index: 1; (optional, ensures it's above background) */
        }

        /* ::after creates the teal fill (bottom part), below the stroke */
        .shape-container::after {
            background-color: #7ACBCB; /* The teal color */
            /*
                The clip-path for the teal area.
                Its top zig-zag edge starts at the bottom edge of the stroke.
            */
            clip-path: polygon(
                /* Top zig-zag edge of the teal area */
                0%     calc(var(--y-peak) + var(--stroke-half-width)),
                12.5%  calc(var(--y-valley) + var(--stroke-half-width)),
                25%    calc(var(--y-peak) + var(--stroke-half-width)),
                37.5%  calc(var(--y-valley) + var(--stroke-half-width)),
                50%    calc(var(--y-peak) + var(--stroke-half-width)),
                62.5%  calc(var(--y-valley) + var(--stroke-half-width)),
                75%    calc(var(--y-peak) + var(--stroke-half-width)),
                87.5%  calc(var(--y-valley) + var(--stroke-half-width)),
                100%   calc(var(--y-peak) + var(--stroke-half-width)),
                
                /* Fill the rest of the bottom part */
                100% 100%, /* Bottom-right corner */
                0% 100%    /* Bottom-left corner */
            );
            /* z-index: 2; (optional, ensures it's above stroke if defined after ::before) */
        }

    </style>
</head>
<body>
    <div class="shape-container">
        <!-- Background is light yellow (top part) -->
        <!-- ::before pseudo-element creates the black stroke -->
        <!-- ::after pseudo-element creates the teal part (bottom part) -->
    </div>
</body>
</html>
