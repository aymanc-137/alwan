<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Item</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Optional: Add a custom Arabic font if desired */
        /* @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap'); */
        body {
            /* font-family: 'Tajawal', sans-serif; */
            background-color: #111827; /* Dark background to match screenshot context */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="relative bg-white rounded-xl shadow-lg p-6 sm:p-8 max-w-md sm:max-w-lg w-full">
    <!-- Profile Image: Absolutely Positioned -->
    <img
        src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8cG9ydHJhaXR8ZW58MHx8MHx8fDA%3D&auto=format&fit=crop&w=100&q=60"
        alt="فاطمة ممحمد"
        class="absolute -top-10 -left-10 sm:-top-12 sm:-left-12 w-24 h-24 sm:w-28 sm:h-28 rounded-full object-cover border-4 border-white shadow-md"
        style="transform: translateX(50%);"
    />
    <!-- Using style for transform because Tailwind's translate-x-1/2 might not be exactly what's needed when combined with RTL absolute positioning -->


    <div class="flex justify-between items-start mb-4">
        <!-- Quotation Marks -->
        <div class="text-7xl sm:text-8xl text-gray-300 -mt-2 select-none" style="line-height: 0.6;">
            ”
        </div>

        <!-- Reviewer Info -->
        <div class="text-left mr-auto ml-4"> {/* text-left because dir=rtl reverses flex items */}
            <h3 class="text-lg sm:text-xl font-semibold text-gray-800">فاطمة ممحمد</h3>
            <div class="flex mt-1">

                <svg class="w-5 h-5 sm:w-6 sm:h-6 text-yellow-400" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>

    <!-- Review Text -->
    <p class="text-xl sm:text-2xl text-gray-700 font-medium text-center mt-6 sm:mt-8">
        العاب مميز و جميلة
    </p>
</div>

</html>
